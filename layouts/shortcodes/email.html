{{- /* E-mail anti-spam: o endereço fica quebrado no HTML e é montado pelo navegador. Edite as partes abaixo. */ -}}
<span class="email-obf" data-u="mazalves" data-d="inf.ufpr.br"><noscript>mazalves [at] inf.ufpr.br</noscript></span>
<script>document.querySelectorAll('.email-obf').forEach(function(e){var a=e.dataset.u+'@'+e.dataset.d;e.innerHTML='<a href="mailto:'+a+'">'+a+'</a>'})</script>
